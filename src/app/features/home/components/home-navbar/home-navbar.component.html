<header class="topbar">
  <div class="brand" (click)="onSelectSection('hero')" role="button" tabindex="0" [attr.aria-label]="'home.brand.name' | translate">
    <span class="brand-mark">M</span>
    <div class="brand-copy">
      <span class="brand-name">{{ 'home.brand.name' | translate }}</span>
      <small>{{ 'home.brand.subtitle' | translate }}</small>
    </div>
  </div>

  <!-- Desktop Navigation (Clean: 3 links) -->
  <nav class="desktop-nav" aria-label="Navegação principal">
    <button type="button" class="nav-link" (click)="onSelectSection('especialidades')">
      {{ 'home.nav.specialties' | translate }}
    </button>
    <button type="button" class="nav-link" (click)="onSelectSection('faq')">
      {{ 'home.nav.faq' | translate }}
    </button>
    <button type="button" class="nav-link" (click)="onSelectSection('contato')">
      {{ 'home.nav.contact' | translate }}
    </button>
  </nav>

  <!-- Desktop Actions -->
  <div class="header-actions">
    <!-- Ícones de Contato Rápido (WhatsApp & Instagram) -->
    <div class="header-social-group">
      <button
        type="button"
        class="header-social-btn whatsapp-social"
        (click)="openWhatsApp()"
        title="Falar no WhatsApp"
        aria-label="Falar no WhatsApp"
        >
        <app-icon name="whatsapp" [size]="18" />
      </button>

      <button
        type="button"
        class="header-social-btn instagram-social"
        (click)="openInstagram()"
        title="Acessar Instagram Oficial"
        aria-label="Acessar Instagram Oficial"
        >
        <app-icon name="instagram" [size]="18" />
      </button>
    </div>

    <!-- Portal Dropdown Toggle -->
    <div class="portal-wrapper" (clickOutside)="closePortalMenu()">
      <button type="button" class="portal-toggle" (click)="togglePortalMenu()" [attr.aria-expanded]="portalMenuOpen">
        <app-icon name="user" [size]="18" class="portal-icon" />
        <span class="portal-label">Portal Clínico</span>
        <app-icon name="chevron" [size]="14" [strokeWidth]="2.5" [class]="portalMenuOpen ? 'chevron-icon open' : 'chevron-icon'" />
      </button>

      @if (portalMenuOpen) {
        <div class="portal-dropdown">
          <button type="button" class="portal-dropdown-item" (click)="goPatient()">
            <div class="item-icon patient-icon-bg">
              <app-icon name="report" [size]="18" />
            </div>
            <div class="item-text">
              <strong>Anamnese do Paciente</strong>
              <small>Preenchimento e envio de ficha</small>
            </div>
          </button>
          <button type="button" class="portal-dropdown-item" (click)="goPsych()">
            <div class="item-icon psych-icon-bg">
              <app-icon name="lock" [size]="18" />
            </div>
            <div class="item-text">
              <strong>Área do Psicólogo</strong>
              <small>Acesso seguro ao painel clínico</small>
            </div>
          </button>
        </div>
      }
    </div>

    <!-- Schedule CTA -->
    <button type="button" class="nav-cta-btn" (click)="openWhatsApp()">
      <app-icon name="whatsapp" [size]="18" class="cta-whatsapp-icon" />
      <span>Agendar Consulta</span>
    </button>
  </div>

  <!-- Mobile Quick Action & Hamburger Group -->
  <div class="mobile-actions-wrapper">
    <!-- Ícones de toque rápido visíveis diretamente no topo do mobile -->
    <button
      type="button"
      class="mobile-quick-btn mobile-whatsapp-btn"
      (click)="openWhatsApp()"
      aria-label="Falar no WhatsApp"
      title="WhatsApp"
      >
      <app-icon name="whatsapp" [size]="18" />
    </button>

    <button
      type="button"
      class="mobile-quick-btn mobile-instagram-btn"
      (click)="openInstagram()"
      aria-label="Instagram Oficial"
      title="Instagram"
      >
      <app-icon name="instagram" [size]="18" />
    </button>

    <!-- Mobile Hamburger Button -->
    <button
      class="menu-button"
      type="button"
      [attr.aria-label]="'home.menu.aria' | translate"
      (click)="toggleMenu()"
      [class.active]="menuOpen"
      >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Drawer Panel -->
  @if (menuOpen) {
    <div class="menu-panel">
      <div class="mobile-nav-links">
        <button type="button" class="mobile-nav-link" (click)="onSelectSection('especialidades')">
          {{ 'home.nav.specialties' | translate }}
        </button>
        <button type="button" class="mobile-nav-link" (click)="onSelectSection('faq')">
          {{ 'home.nav.faq' | translate }}
        </button>
        <button type="button" class="mobile-nav-link" (click)="onSelectSection('contato')">
          {{ 'home.nav.contact' | translate }}
        </button>
      </div>
      <div class="mobile-divider"></div>
      <div class="mobile-portal-group">
        <span class="mobile-group-title">Acesso ao Sistema</span>
        <button type="button" class="menu-item patient" (click)="goPatient()">
          <app-icon name="report" [size]="18" class="btn-svg" />
          <span>{{ 'home.menu.patient' | translate }}</span>
        </button>
        <button type="button" class="menu-item psych" (click)="goPsych()">
          <app-icon name="lock" [size]="18" class="btn-svg" />
          <span>{{ 'home.menu.psych' | translate }}</span>
        </button>
      </div>
      <div class="mobile-divider"></div>
      <div class="mobile-drawer-cta-group">
        <button type="button" class="mobile-cta-btn whatsapp-cta" (click)="openWhatsApp()">
          <app-icon name="whatsapp" [size]="20" />
          <span>Falar no WhatsApp</span>
        </button>
        <button type="button" class="mobile-cta-btn instagram-cta" (click)="openInstagram()">
          <app-icon name="instagram" [size]="20" />
          <span>Acompanhar no Instagram</span>
        </button>
      </div>
    </div>
  }
</header>

<!-- Backdrop para fechar o menu mobile ao tocar fora -->
@if (menuOpen) {
  <div class="menu-backdrop" (click)="closeMenu()" aria-hidden="true"></div>
}

<div class="page-shell">
  <!-- Topbar / Navbar isolada -->
  <app-home-navbar (sectionSelected)="scrollToSection($event)" />

  <!-- Conteúdo Principal Modularizado -->
  <main>
    <app-home-hero
      (contactClick)="openWhatsApp()"
      (exploreClick)="scrollToSection('especialidades')"
    />

    <app-home-specialties (itemClick)="openWhatsApp()" />

    <app-home-faq />

    <app-home-contact />

    <!-- Nova Seção de Localização e Cidades Atendidas -->
    <app-home-location />
  </main>

  <!-- Rodapé Institucional -->
  <app-home-footer />

  <!-- Botão Flutuante Global de WhatsApp (Desktop) -->
  <app-whatsapp-fab />

  <!-- Botão Sticky Mobile de WhatsApp (Mobile) -->
  <app-whatsapp-sticky-mobile />
</div>

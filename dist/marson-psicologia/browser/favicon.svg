<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183e66" />
      <stop offset="100%" stop-color="#0c1d32" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf1dc" />
      <stop offset="40%" stop-color="#f7e0b5" />
      <stop offset="100%" stop-color="#d3a75d" />
    </linearGradient>
  </defs>
  <!-- Background with delicate gold border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#d3a75d" stroke-width="2.5" />
  <!-- Monogram M -->
  <text x="32" y="45" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-1">M</text>
  <!-- Small clinical accent dot -->
  <circle cx="48" cy="18" r="3" fill="#d3a75d" />
</svg>
